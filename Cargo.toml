[package]
name = "testkit"
version = "0.2.2"
edition = "2021"
license = "MIT/Apache-2.0"
description = "A DSL for testing. Starting with APIs and Browser automation."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["video"]
# H.264/MP4 receipts (compiles the bundled openh264 encoder); GIFs are always produced
video = ["dep:openh264", "dep:mp4"]

[lib]
name = "testkit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"], default-features = false }
tokio = { version = "1.29.1", features = ["full"] }
clap = { version = "4.3.10", features = ["derive", "env"] }
rusty-hook = "0.11.2"
env_logger = "0.11.3"
log = "0.4.19"
rhai = "1.15.0"
jsonpath_lib = "0.3.0"
jsonpath = "0.1.1"
regex = "1.8.4"
dotenv = "0.15.0"
libc = "0.2"
lazy_static = "1.4"
anyhow = "1.0"
glob = "0.3"
miette = { version = "7.2.0", features = ["fancy"] }
thiserror = "2.0.11"
serde_with = "3.0.0"
colored_json = "5"
chrono = "0.4.26"
walkdir = "2.3.3"
chromiumoxide = "0.9"
futures-util = "0.3"
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
winnow = "0.7"
portable-pty = "0.9"
vt100 = "0.15"
sha2 = "0.10"
gif = "0.13"
png = "0.17"
base64 = "0.22"
openh264 = { version = "0.9", optional = true }
mp4 = { version = "0.14", optional = true }
bytes = "1"

# core-foundation = {git="https://github.com/servo/core-foundation-rs", rev="9effb788767458ad639ce36229cc07fd3b1dc7ba"}
[dev-dependencies]
httpmock = "0.7"
testing_logger = "0.1.1"
