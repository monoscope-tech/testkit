- claim: Several todos can be added
- visit: https://demo.playwright.dev/todomvc
- fill: What needs to be done? with "Buy milk"
- press: Enter
  expect: '"Buy milk" and "1 item left"'
- enter: Walk the dog
  expect: '"Buy milk" and "Walk the dog" and "2 items left"'
- enter: Finish report
  expect: '"Buy milk" and "Walk the dog" and "Finish report" and "3 items left"'

- claim: A todo can be completed
- check: Toggle Todo in listitem "Buy milk"
- expect: '"2 items left" and button "Clear completed"'
