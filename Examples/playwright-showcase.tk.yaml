# A full order-lifecycle journey against the fixture app (tests/app), side by side with the Playwright
# test you would write for it (bottom of this file). Covers: auth failures + success, session cookies
# shared with API calls, data-driven creation via a reusable flow, server-side validation, a mocked
# backend outage, aria-structure asserts, table data extraction, new tabs, downloads, native confirm
# dialogs, cross-origin iframes, slow-loading UI, perf budgets, the console-error guard, emulation and
# screenshots as evidence.
#
#   testkit test  Examples/playwright-showcase.tk.yaml   # run it
#   testkit prove Examples/playwright-showcase.tk.yaml   # run it and emit a verifiable receipt with a GIF per claim
- meta: { base_url: "http://127.0.0.1:${port}" }
- call: ../tests/tk/flows/app.yaml
  exports: [port]

- claim: Wrong credentials are rejected without leaving the login page
- visit: /login
- expect: form "Sign in" matches button exactly "Sign in"
- fill: Email with "admin@acme.com"
- fill: Password with "wrong"
- click: button exactly "Sign in"
- expect: alert "Invalid email or password" is visible
- expect: the status of request "POST /api/session" is 401
- expect: the path is "/login"
- expect: the value of field "Email" is "admin@acme.com"

- claim: A user signs in with the keyboard and the session works for API calls
- check: Remember me
- fill: Password with "hunter22"
- press: Enter
- expect: the url ends with "/dashboard"
- expect: '"Signed in as admin@acme.com"'
- expect: navigation "Main"
  matches:
    - link "Dashboard"
    - link "Orders"
    - link "Widgets"
- expect: the cookie "sid" exists
- GET: /api/me
  cookies: from default
  expect: [status is 200, json.email is "admin@acme.com"]

- claim: Orders created through the UI are persisted (data-driven)
- call: flows/create-order.yaml
  with: { customer: "${customer}", plan: "${plan}" }
  iterations:
    - { customer: Alice, plan: Pro }
    - { customer: Carol, plan: Enterprise }
- GET: /api/orders
  cookies: from default
  expect:
    - its status is 200
    - the length of its json is 3
    - (its json mapped to its customer) contains "Carol"
    - (its json mapped to its status) contains "paid"

- claim: Server-side validation errors surface in the form
- visit: /orders/new
- click: Save
- expect: alert "customer is required" is visible
- expect: the status of request "POST /api/orders" is 422
- expect: the path is "/orders/new"

- claim: A backend outage is shown to the user, not swallowed
- route: POST /api/orders
  respond: { status: 503, json: { error: "database unavailable" } }
- fill: Customer with "Zed"
- fill: Plan with "Starter"
- click: Save
- expect: alert "database unavailable" is visible
- expect: request "POST /api/orders"'s mocked is true
- unroute: POST /api/orders
- GET: /api/orders
  expect: (its json mapped to its customer) does not contain "Zed"

- claim: The orders table reflects the backend, row by row
- visit: /orders
- expect: table "Orders"
  matches:
    - row /1042/:
      - cell "Bob"
      - cell "paid"
    - row /Alice/:
      - cell "Pro"
      - cell "pending"
    - row /Carol/:
      - cell "Enterprise"
- expect: '"3 orders"'
- extract: the rows of table "Orders" into rows
- expect: the length of (rows where its Status is "pending") is 2
- expect: (rows mapped to its Customer) joined by "," is "Bob,Alice,Carol"

- claim: Orders open in a new tab and export as CSV
- visit: /popup
- click: button "Accept" in dialog "Cookie consent"
- expect: no dialog "Cookie consent"
- click: link "Open orders in new tab"
- wait: for popup into orders_tab
- expect: heading "Orders" is visible
  session: orders_tab
- click: link "Export CSV"
  session: orders_tab
- wait: for download into csv
- expect: csv ends with "orders.csv"
- expect: file "${csv}"'s text contains "1042,Bob"

- claim: Deleting asks for confirmation and removes the order everywhere
- visit: /orders
  session: default
- click: button "Delete" in row /Alice/
  dialog: dismiss
- expect: row /Alice/ is visible
- click: button "Delete" in row /Alice/
  dialog: accept
- expect: no row /Alice/
- expect: the status of request "DELETE /api/orders/*" is 200
- expect: '"2 orders"'
- GET: /api/orders
  expect: (its json mapped to its customer) does not contain "Alice"

- claim: Payment inside a cross-origin iframe completes
- visit: /xframe
- click: button "Pay now" in frame "xpay"
- expect: button "Paid" in frame "xpay" is visible

- claim: Slow data loads without sleeps and interactions stay within budget
- visit: /slow
- expect: button "Continue" is disabled
- expect: status "Ready" is visible
- expect: button "Continue" is enabled
- expect: the duration of request "GET /api/slow" is greater than 500ms
- visit: /shift
- click: button "Add"
  measure: true
- expect: its duration is less than 2s
- expect: the lcp of page is less than 2.5s
- expect: no long tasks over 200ms

- claim: Unexpected console errors fail the run unless explicitly allowed
- visit: /broken
- expect: no console errors
- click: button "Explode"
  allow: [console errors, page errors]
- expect: some console errors
- expect: all console messages contains "ready"

- claim: The dashboard renders on a phone in dark mode
- emulate: iPhone 15
- emulate: dark
- visit: /dashboard
- expect: heading "Dashboard" is visible
- expect: link "Orders" is visible
- shot: dashboard-iphone-dark.png
- expect: file "${it.file}" exists
- emulate: desktop

