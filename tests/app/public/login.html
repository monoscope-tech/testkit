<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme</title><style>body{font:15px system-ui;margin:24px} .alert{background:#e1f1e8;padding:6px} table td,table th{padding:4px 10px;text-align:left} .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center} .modal div{background:#fff;padding:20px}</style></head><body><main><h1>Sign in</h1>
<form id="login" aria-label="Sign in">
<label for="email">Email</label> <input id="email" name="email" type="email" required>
<label>Password <input name="password" type="password" required></label>
<label><input type="checkbox" name="remember"> Remember me</label>
<button type="submit">Sign in</button> <button type="button">Sign in with Google</button>
<p role="alert" id="err" hidden></p>
</form>
<script>
document.getElementById('login').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const r = await fetch('/api/session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: f.get('email'), password: f.get('password')})});
  if (r.ok) location.href = '/dashboard'; else { const err = document.getElementById('err'); err.hidden = false; err.textContent = (await r.json()).error; }
});
</script></main></body></html>
